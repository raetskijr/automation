# --- сервисы ---
services:
  # --- контроллер ---
  jenkins-controller:
    image: jenkins/jenkins:lts
    container_name: jenkins-controller
    restart: always
    ports:
      - "8080:8080"     # веб-интерфейс
      - "50000:50000"   # входящие агенты (здесь не используется)
    volumes:
      - jenkins_home:/var/jenkins_home
    networks:
      - jenkins-network

  # --- агент ---
  ssh-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ssh-agent
    restart: always
    environment:
      # ключ из .env (создаёт setup.sh)
      - JENKINS_AGENT_SSH_PUBKEY=${JENKINS_AGENT_SSH_PUBKEY}
    volumes:
      - jenkins_agent_volume:/home/jenkins/agent
    depends_on:
      - jenkins-controller
    networks:
      - jenkins-network

# --- тома ---
volumes:
  jenkins_home:
  jenkins_agent_volume:

# --- сеть ---
networks:
  jenkins-network:
    driver: bridge
